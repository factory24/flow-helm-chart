# Default service properties
serviceProperties:
  name: "default-service"
  namespace: "flow"
  enabled: false

deployment:
  enabled: false
  replicaCount: 1
  restartPolicy: Always
  # Rolling update: kill old pod first, then start new (maxSurge=0).
  # Prevents Pending deadlock on CPU-constrained clusters.
  maxUnavailable: 1
  maxSurge: 0
  revisionHistoryLimit: 2
  args: []
  env: []
  initContainers: []
  volumes: []
  volumeMounts: []
  nodeSelector: {}
  affinity: {}
  tolerations: []
  podAnnotations: {}
  image:
    # repository -- The image repository to pull from
    repository: your-repo.acr.io
    tag: latest
    pullPolicy: Always
  ports: {}

service:
  enabled: false
  type: ClusterIP
  ports: { }

resources:
  # Requests are what the scheduler uses to place pods — keep them low and
  # realistic. Limits allow burst (GC, cold start, IoT spikes) without
  # throttling. Setting limit == request (old behaviour) caused CPU throttling
  # on Go services and made the cluster appear full at 30% actual usage.
  #
  # Actual observed usage across Flow services: 5-40m CPU, 40-100Mi RAM.
  # With Istio sidecar adding 100m CPU request per pod, the old 100m+100m=200m
  # per pod exhausted 6 nodes at only 53 pods. With 50m+100m=150m we get ~30%
  # more scheduling headroom on the same hardware.
  limits:
    cpu: 500m      # allow burst; Go GC and IoT uplink spikes need headroom
    memory: 256Mi
  requests:
    cpu: 50m       # realistic steady-state for a Go/Echo service
    memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10

configMap:
  enabled: false
  data: { }

secrets:
  enabled: false
  data: { }

certificate:
  enabled: false
  secretName: ''
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  commonName: ''
  dnsNames: { }

gateway:
  enabled: false
  name: ''
  namespace: ''
  specSelector: ''
  servers: { }

virtualService:
  enabled: false
  gateways:
    - api-gateway
  # hosts (preferred) — list one or more hostnames this VirtualService serves.
  # Use multiple hosts when a service must be reachable under more than one domain
  # (e.g. api.everyflow.org for the main API gateway AND docs.everyflow.org for a
  # docs gateway).  All listed gateways are applied to all listed hosts.
  # hosts:
  #   - api.your-domain.com
  #   - other.your-domain.com
  #
  # host (legacy, single value) — still supported for backward compatibility when
  # only one hostname is needed.  Ignored when `hosts` is set.
  host: api.your-domain.com
  httpRoutes:
    - name: default-service
      corsPolicy:
        allowOrigins:
          - regex: ".*"
          - exact: "*"
        allowHeaders:
          - authorization
          - content-type
        allowMethods:
          - GET
          - PUT
          - POST
          - PATCH
          - DELETE
      match:
        - uri:
            prefix: /
      route:
        - destination:
            host: default-service.flow.svc.cluster.local
            port:
              number: 8080



destinationRule:
  enabled: false
  host: ''
  trafficPolicy:
    loadBalancer:
      simple: ''
    tls:
      mode: ''
  subsets:
    - name: ''
      labels:
        version: v3
      trafficPolicy:
        loadBalancer:
          simple: ''

pdb:
  # Enable PodDisruptionBudget to protect against simultaneous pod eviction
  # during node drain, cluster upgrades, or autoscaler scale-down.
  # Safe to enable for all stateless services; set minAvailable: 0 for
  # single-replica services you can tolerate brief downtime on.
  enabled: false
  minAvailable: 1

cronJob:
  enabled: false
  schedule: "59 23 28-31 * *"
  restartPolicy: OnFailure
  image:
    repository: your-repo.acr.io
    tag: latest
    pullPolicy: Always
  env: []
  args: []
  command: []
  initContainers: []
  nodeSelector: {}
  affinity: {}
  tolerations: []
  volumes: []
  # Cron job resource defaults — never leave these empty.
  # Pods without requests get Burstable/BestEffort QoS and are evicted first.
  # The Istio sidecar annotation (injected by the template) adds ~100m CPU
  # request automatically.
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  metadata: {}

sidecar:
  enabled: false
  name: ""
  namespace: ""
  egress:
    - hosts:
      - "./*"
      - "default/*"
      - "flow/*"

persistentVolume:
  enabled: false
  labelType: ''
  storage:
    className: 'default'
    capacity: '10Gi'
  accessModes:
    - ReadWriteOnce
  hostPath: '/mnt/data'

persistentVolumeClaim:
  enabled: false
  accessModes:
    - ReadWriteOnce
  storage: 16Gi

argocd:
  name: ' '
  enabled: false
  namespace: ' '
  projectName: ''
  sources: [ ]
  sync:
    automated:
      prune: 'true'
      selfHeal: 'true'
    options:
      - RespectIgnoreDifferences=true
      - PruneLast=true
      - Validate=false
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
    retry:
      limit: '2'
      backoffDuration: '5s'
      backOffMaxDuration: '3m0s'
      backOffFactor: '2'
  destination:
    name: ''
    namespace: ''
    server: 'https://kubernetes.default.svc'
  repository:
    url: ''
    path: ''
    targetRevision: ''
    chart: ''
    valueFiles: { }
  values: { }

metrics:
  enabled: true
  scrape: "true"
  port: "8080"
  path: "/metrics"

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 5   # conservative default — override per service
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # 70% of request (50m) = 35m actual before scale-up triggers.
          # Lower threshold means earlier scale-out, keeping latency low
          # for IoT uplink bursts without waiting until the pod is saturated.
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      # Wait 5 min before scaling down — prevents thrashing on short traffic
      # bursts (IoT uplink batches, vendor session peaks).
      stabilizationWindowSeconds: 300
      policies:
        # Only remove 1 pod per minute on scale-down. Prevents wiping all
        # replicas at once and causing a brief outage. The old 100%/15s
        # policy could kill all pods in one pass after the 5-min window.
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      # 60s stabilization on scale-up — avoids spinning up extra nodes for
      # short IoT bursts that self-resolve within a minute.
      stabilizationWindowSeconds: 60
      policies:
        # Add at most 2 pods every 30 seconds — steady, predictable growth.
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max